
name: Gestione manutenzione ECO-NOMY

on:
  workflow_dispatch:
    inputs:
      modalita:
        description: "Attiva o disattiva la manutenzione"
        required: true
        type: choice
        options:
          - ATTIVA
          - DISATTIVA

permissions:
  contents: write
  actions: write

concurrency:
  group: gestione-manutenzione
  cancel-in-progress: false

jobs:
  manutenzione:
    runs-on: ubuntu-latest

    steps:
      - name: Recupera il repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Imposta lo stato della manutenzione
        env:
          MODALITA: ${{ inputs.modalita }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$MODALITA" = "ATTIVA" ]; then
            touch .maintenance
          else
            rm -f .maintenance
          fi

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Manutenzione: $MODALITA"
            git push origin "HEAD:$BRANCH"
          else
            echo "Lo stato richiesto è già impostato."
          fi

      - name: Avvia la pubblicazione GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref "$BRANCH"
          echo "Richiesta di pubblicazione inviata."
