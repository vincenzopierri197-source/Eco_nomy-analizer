name: Gestione manutenzione ECO-NOMY

on:
  workflow_dispatch:
    inputs:
      modalita:
        description: "Attiva o disattiva la manutenzione"
        required: true
        type: choice
        options:
          - ATTIVA
          - DISATTIVA

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  manutenzione:
    runs-on: ubuntu-latest

    steps:
      - name: Recupera il repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Imposta lo stato della manutenzione
        env:
          MODALITA: ${{ inputs.modalita }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$MODALITA" = "ATTIVA" ]; then
            touch .maintenance
          elif [ "$MODALITA" = "DISATTIVA" ]; then
            rm -f .maintenance
          else
            echo "Modalità non valida."
            exit 1
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "Lo stato della manutenzione è già quello richiesto."
            exit 0
          fi

          git commit -m "Manutenzione: $MODALITA"
          git push origin "HEAD:$BRANCH"

      - name: Riepilogo
        run: |
          echo "Richiesta completata."
          echo "Controlla il workflow Pubblica eco-nomy su GitHub Pages per verificare la pubblicazione."
