
name: Pubblica eco-nomy su GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recupera i file del sito
        uses: actions/checkout@v6

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepara il sito
        run: |
          mkdir -p _site

          if [ -f .maintenance ]; then
            cp maintenance.html _site/index.html

            if [ -f CNAME ]; then
              cp CNAME _site/CNAME
            fi

            if [ -f .nojekyll ]; then
              cp .nojekyll _site/.nojekyll
            fi
          else
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='_site/' \
              --exclude='.maintenance' \
              ./ _site/
          fi

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v5
