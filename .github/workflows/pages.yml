name: Pubblica eco-nomy su GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pubblica esclusivamente il branch predefinito del repository.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recupera i file del sito
        uses: actions/checkout@v6

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepara il sito statico
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v5
