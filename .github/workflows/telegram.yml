name: Notifica Telegram

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
    branches: [main]
  issues:
    types: [opened, closed]
  # Avvisa quando uno di questi workflow termina, bene o male (i nomi devono essere identici)
  workflow_run:
    workflows:
      - "Gestione manutenzione ECO-NOMY"
      - "Pubblica eco-nomy su GitHub Pages"
      - "Pulisci condivisioni scadute"
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Invia messaggio a Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          case "$EVENT" in
            push)
              MSG=$(printf '⬆️ Push su %s (%s)\n👤 %s\n📝 %s\n🔗 %s' "$BRANCH" "$REPO" "$ACTOR" "$FIRST_LINE" "$COMMIT_URL") ;;
            pull_request)
              MSG=$(printf '🔀 Pull request %s (%s)\n📝 %s\n👤 %s\n🔗 %s' "$ACTION" "$REPO" "$PR_TITLE" "$ACTOR" "$PR_URL") ;;
            issues)
              MSG=$(printf '🐛 Issue %s (%s)\n📝 %s\n👤 %s\n🔗 %s' "$ACTION" "$REPO" "$ISSUE_TITLE" "$ACTOR" "$ISSUE_URL") ;;
            workflow_run)
              case "$RUN_RESULT" in
                success)   ICON="✅"; LABEL="completato" ;;
                failure)   ICON="❌"; LABEL="FALLITO" ;;
                cancelled) ICON="🚫"; LABEL="annullato" ;;
                timed_out) ICON="⏱️"; LABEL="andato in timeout" ;;
                *)         ICON="⚠️"; LABEL="terminato ($RUN_RESULT)" ;;
              esac
              MSG=$(printf '%s %s: %s\n🌿 Branch: %s\n🔗 %s' "$ICON" "$RUN_NAME" "$LABEL" "$RUN_BRANCH" "$RUN_URL") ;;
            *)
              exit 0 ;;
          esac
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            -d disable_web_page_preview=true)
          if ! printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "Telegram ha risposto con un errore:"
            printf '%s' "$RESP" | grep -o '"description":"[^"]*"'
            exit 1
          fi
