
name: EcoNomy-AnalYzer - Manutenzione

on:
  workflow_dispatch:
    inputs:
      modalita:
        description: "Scegli cosa fare"
        required: true
        type: choice
        options:
          - ATTIVA
          - DISATTIVA

permissions:
  contents: write

jobs:
  manutenzione:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla repository
        uses: actions/checkout@v4

      - name: Verifica richiesta
        run: |
          echo "Modalità richiesta: ${{ inputs.modalita }}"
          echo "Questo workflow è un esempio iniziale."
          echo "Non modifica ancora il sito pubblicato."
