name: Bot Telegram

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Messaggio Telegram (lo compila il Worker, lascialo vuoto)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  rispondi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Elabora il messaggio
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TG_UPDATE: ${{ inputs.update }}
        run: python3 scripts/telegram_bot.py
