
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ECO-NOMY Analyzer - Manutenzione</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: #0f172a;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      color: #ffffff;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      color: #cbd5e1;
    }

    .brand {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🛠️</div>
    <h1>Manutenzione in corso</h1>
    <p>
      ECO-NOMY Analyzer è temporaneamente non disponibile
      per interventi di manutenzione e miglioramento.
    </p>
    <p>
      Ti invitiamo a riprovare più tardi.
      Grazie per la comprensione.
    </p>
    <div class="brand">ECO-NOMY ANALYZER</div>
  </main>
</body>
</html>
